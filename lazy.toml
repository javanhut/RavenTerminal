# lazy.toml — imlazy task runner config for Raven Terminal
#
# Originally generated by `imlazy migrate` from the Makefile, then completed
# by hand: the distro conditionals in `deps` and the `macos-icon` guard are
# implemented as portable shell, and `race`/`vuln`/`ci` were added to mirror
# .github/workflows/ci.yml. Re-running `imlazy migrate` will clobber these
# fixes — treat this file as the source of truth for imlazy.

[settings]
default = "all"

[variables]
app_name = "raven-terminal"
scripts_dir = "scripts"
blue = "\\033[0;34m"
green = "\\033[0;32m"
yellow = "\\033[1;33m"
red = "\\033[0;31m"
nc = "\\033[0m"

[commands]

[commands.all]
desc = "Default target"
dep = ["build"]

[commands.build]
desc = "Build the application"
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Building {{app_name}}...\"",
  "go build -o {{app_name}} ./src",
  "chmod +x {{app_name}}",
  "echo -e \"{{green}}[OK]{{nc}} Build successful: ./{{app_name}}\"",
]

[commands.install]
desc = "Install system-wide (clean install - uninstalls first)"
dep = ["build"]
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Performing clean global install...\"",
  "{{scripts_dir}}/uninstall.sh --all --force 2>/dev/null || true",
  "{{scripts_dir}}/install.sh --global",
]

[commands.install-local]
desc = "Install for current user (clean install - uninstalls first)"
dep = ["build"]
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Performing clean user install...\"",
  "{{scripts_dir}}/uninstall.sh --all --force 2>/dev/null || true",
  "{{scripts_dir}}/install.sh --user",
]

[commands.fresh]
desc = "Fresh install system-wide: purge everything (config, caches, old binaries, running instances), build from scratch, install, and verify"
run = ["{{scripts_dir}}/clean-install.sh --global"]

[commands.fresh-local]
desc = "Fresh install for current user: same full purge, user-level install"
run = ["{{scripts_dir}}/clean-install.sh --user"]

[commands.purge]
desc = "Remove every trace of raven-terminal (installs, config, caches, instances)"
run = ["{{scripts_dir}}/uninstall.sh --purge --force"]

[commands.uninstall]
desc = "Uninstall all installations (clean uninstall)"
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Uninstalling all raven-terminal installations...\"",
  "{{scripts_dir}}/uninstall.sh --all --force",
]

[commands.uninstall-local]
desc = "Uninstall user installation"
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Uninstalling user installation...\"",
  "{{scripts_dir}}/uninstall.sh --user --force",
]

[commands.uninstall-all]
desc = "Uninstall everything including config"
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Uninstalling all installations and config...\"",
  "{{scripts_dir}}/uninstall.sh --all --config --force",
]

[commands.clean]
desc = "Clean build artifacts"
run = [
  "echo -e \"{{blue}}[INFO]{{nc}} Cleaning build artifacts...\"",
  "rm -f {{app_name}}",
  "go clean",
  "echo -e \"{{green}}[OK]{{nc}} Clean complete\"",
]

# imlazy runs each entry through a shell, so the Makefile's OS/distro
# conditionals live here as one portable case statement. Distro branches
# mirror the Makefile exactly.
[commands.deps]
desc = "Install build dependencies for your OS"
run = ["""
echo -e "{{blue}}[INFO]{{nc}} Installing build dependencies..."
case "$(uname -s)" in
  Linux)
    if [ -f /etc/arch-release ]; then
      sudo pacman -S --needed --noconfirm go base-devel libx11 libxcursor libxrandr libxinerama libxi mesa pkg-config
    elif [ -f /etc/debian_version ]; then
      sudo apt-get update
      sudo apt-get install -y golang build-essential libgl1-mesa-dev xorg-dev pkg-config
    elif [ -f /etc/fedora-release ] || [ -f /etc/redhat-release ]; then
      sudo dnf install -y golang mesa-libGL-devel libX11-devel libXcursor-devel libXrandr-devel libXinerama-devel libXi-devel pkg-config
    elif [ -f /etc/opensuse-release ]; then
      sudo zypper install -y go Mesa-libGL-devel libX11-devel libXcursor-devel libXrandr-devel libXinerama-devel libXi-devel pkg-config
    elif [ -f /etc/alpine-release ]; then
      sudo apk add go build-base mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev pkgconfig
    else
      echo -e "{{red}}[ERROR]{{nc}} Unknown distribution."
      echo "Install manually: Go compiler, OpenGL dev libraries, X11/Wayland dev libraries, pkg-config"
      exit 1
    fi
    ;;
  Darwin)
    if ! command -v brew >/dev/null 2>&1; then
      echo -e "{{red}}[ERROR]{{nc}} Homebrew is not installed. Install it from https://brew.sh"
      exit 1
    fi
    brew install go pkg-config librsvg
    ;;
  *)
    echo -e "{{red}}[ERROR]{{nc}} Unsupported OS: $(uname -s)"
    exit 1
    ;;
esac
echo -e "{{green}}[OK]{{nc}} Dependencies installed successfully!"
"""]

# NOTE: `$$` in a run entry reaches the shell verbatim (expands to the PID),
# so plain shell `$` is used everywhere below.
[commands.deps-check]
desc = "Check if build dependencies are installed"
run = ["""
echo -e "{{blue}}[INFO]{{nc}} Checking dependencies..."
missing=""
if command -v go >/dev/null 2>&1; then
  echo -e "{{green}}[OK]{{nc}} Go compiler: $(go version | awk '{print $3}')"
else
  echo -e "{{red}}[MISSING]{{nc}} Go compiler"; missing="$missing go"
fi
if command -v pkg-config >/dev/null 2>&1; then
  echo -e "{{green}}[OK]{{nc}} pkg-config"
else
  echo -e "{{red}}[MISSING]{{nc}} pkg-config"; missing="$missing pkg-config"
fi
if pkg-config --exists gl 2>/dev/null; then
  echo -e "{{green}}[OK]{{nc}} OpenGL libraries"
else
  echo -e "{{red}}[MISSING]{{nc}} OpenGL development libraries"; missing="$missing opengl"
fi
if pkg-config --exists x11 2>/dev/null || pkg-config --exists wayland-client 2>/dev/null; then
  echo -e "{{green}}[OK]{{nc}} Display libraries (X11/Wayland)"
else
  echo -e "{{red}}[MISSING]{{nc}} X11 or Wayland development libraries"; missing="$missing display"
fi
if [ -n "$missing" ]; then
  echo ""
  echo -e "{{yellow}}[WARNING]{{nc}} Some dependencies are missing:$missing"
  echo "Run 'make deps' or 'imlazy deps' to install them."
  exit 1
fi
echo -e "{{green}}[OK]{{nc}} All dependencies are installed!"
"""]

[commands.test]
desc = "Run tests"
run = ["go test ./..."]

[commands.format]
desc = "Run go fmt"
alias = ["fmt"]
run = ["go fmt ./..."]

[commands.fix]
desc = "Run go fix on the repo"
run = ["go fix ./..."]

[commands.check]
desc = "Format check + vet + tests"
run = ["""
echo -e "{{blue}}[INFO]{{nc}} Checking gofmt..."
unformatted=$(gofmt -l src)
if [ -n "$unformatted" ]; then
  echo -e "{{red}}[FAIL]{{nc}} gofmt needed on:"
  echo "$unformatted"
  exit 1
fi
echo -e "{{blue}}[INFO]{{nc}} Running go vet..."
go vet ./...
echo -e "{{blue}}[INFO]{{nc}} Running tests..."
go test ./...
echo -e "{{green}}[OK]{{nc}} All checks passed"
"""]

[commands.race]
desc = "Race-detector tests (same package set as CI)"
run = ["go test -race ./src ./src/grid ./src/parser ./src/aitools ./src/shell ./src/websearch ./src/ollama ./src/tab"]

[commands.vuln]
desc = "Vulnerability scan with govulncheck (same as CI)"
run = ["go run golang.org/x/vuln/cmd/govulncheck@latest ./..."]

[commands.ci]
desc = "All local CI-equivalent checks: check + race + vuln"
dep = ["check", "race", "vuln"]

[commands.macos-icon]
desc = "Generate macOS app icon (macOS only)"
run = ["""
if [ "$(uname -s)" = "Darwin" ]; then
  {{scripts_dir}}/generate-macos-icon.sh
else
  echo -e "{{yellow}}[WARNING]{{nc}} This command must be run on macOS."
  echo "The macOS icon is generated automatically during install when conversion tools are available."
fi
"""]

[commands.make_help]
desc = "Show Raven Terminal task help"
run = ["""
echo ""
echo -e "{{blue}}Raven Terminal tasks (imlazy){{nc}}"
echo ""
echo "Usage: imlazy [command]"
echo ""
echo "Common tasks:"
echo "  build           Build the application (default)"
echo "  install         Clean install system-wide (requires sudo)"
echo "  install-local   Clean install for current user"
echo "  fresh           Full purge + scratch build + system-wide install"
echo "  fresh-local     Full purge + scratch build + user install"
echo "  purge           Remove every trace: installs, config, caches"
echo "  uninstall*      Variants for user / global / with-config removal"
echo "  deps            Install build dependencies for your OS"
echo "  deps-check      Verify build dependencies"
echo "  check           gofmt + go vet + go test"
echo "  race            Race-detector tests (CI package set)"
echo "  vuln            govulncheck vulnerability scan"
echo "  ci              check + race + vuln (local CI equivalent)"
echo "  test            Run tests"
echo "  clean           Remove build artifacts"
echo "  macos-icon      Generate macOS app icon (macOS only)"
echo ""
echo "Run 'imlazy list' for the full list with descriptions."
"""]

# imlazy-generated-end: everything below this line is yours and survives re-sync
